name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # =========================
      # BillingSystem
      # =========================

      - name: Restore BillingSystem
        run: dotnet restore BillingSystem.csproj

      - name: Build BillingSystem
        run: dotnet build BillingSystem.csproj --no-restore

      - name: Test BillingSystem
        run: dotnet test BillingSystem.csproj --no-build --verbosity normal

      # =========================
      # Backend2
      # =========================

      - name: Restore Backend2
        run: dotnet restore backend2/backend2.csproj

      - name: Build Backend2
        run: dotnet build backend2/backend2.csproj --no-restore

      - name: Test Backend2
        run: dotnet test backend2/backend2.csproj --no-build --verbosity normal

      # =========================
      # AutoHeal Callback
      # =========================

      - name: Notify AutoHeal on Failure
        if: ${{ failure() }}
        run: |
          curl -X POST \
            https://cicd-backend-n7hu.onrender.com/api/healing/failure \
            -H "Content-Type: application/json" \
            -H "X-Healer-Secret: ${{ secrets.HEALER_CALLBACK_SECRET }}" \
            -d '{
              "repository": "${{ github.event.repository.name }}",
              "owner": "${{ github.repository_owner }}",
              "branch": "${{ github.ref_name }}",
              "commitSha": "${{ github.sha }}",
              "workflowRunId": ${{ github.run_id }}
            }'
